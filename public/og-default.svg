    <path d="M30 78V26"/>
    <circle cx="30" cy="13" r="12"/>
    <path d="M9 44H0a30 30 0 0 0 60 0h-9"/>
  </g>

  <text x="92" y="268" font-family="Noto Serif SC, Songti SC, SimSun, serif" font-size="108" font-weight="700" fill="#f6f2e9">沙田港</text>
  <text x="92" y="336" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" fill="#a9d2ea">广西壮族自治区 · 北海市 · 合浦县 · 沙田镇</text>

  <line x1="92" y1="380" x2="1108" y2="380" stroke="#1c5f88" stroke-width="2"/>

  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" fill="#d5e9f5">
