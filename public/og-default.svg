      <stop offset="0%" stop-color="#0d3550"/>
      <stop offset="60%" stop-color="#082438"/>
      <stop offset="100%" stop-color="#061019"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f8fbf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3f8fbf" stop-opacity="0"/>
