    <text x="92" y="480">海上丝绸之路始发港合浦　·　南珠采珠史　·　疍家渔港文化</text>
  </g>

  <text x="92" y="556" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#93a5b1">
