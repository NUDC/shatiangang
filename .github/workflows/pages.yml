name: Deploy to GitHub Pages

# GitHub Pages 部署。这是站点唯一的托管目标。
#
# 项目站点挂在 /<仓库名>/ 下，所以 BASE_PATH=/shatiangang/。站内链接经
# src/lib/url.ts 从这个 base 自动派生，换挂载点只改这一个环境变量。
#
# 边缘网关 114.55.135.237/shatiangang/ 只是一个 302 跳转，最终落到这里。

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

# Pages 部署的标准权限组合
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # GitHub 项目站点的域名是全小写的 <user>.github.io，
          # 仓库名段大小写保留。canonical / sitemap / JSON-LD @id 全从这里派生。
          SITE_URL: https://nudc.github.io
          BASE_PATH: /shatiangang/
        run: npm run build

      - name: GEO 自检
        env:
          BASE_PATH: /shatiangang/
        run: npm run audit:geo

      # **GitHub Pages 默认用 Jekyll，会忽略以 _ 开头的目录。**
      # Astro 的产物放在 _astro/ 下 —— 没有这个文件，全站 CSS/JS 都 404，
      # 页面出来是无样式的纯文本。这一步是 Pages + 任何静态生成器的必备。
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
