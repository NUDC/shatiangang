# =============================================================================
# 北部湾沙田港 · nginx 配置
# =============================================================================
#
# **纯静态站点。** 只有 nginx + 一棵目录树，没有后端、没有需要注入的密钥。
# 高德地图改用明文 securityJsCode（密钥在前端，靠域名白名单兜底），
# 因此不再需要任何反向代理，这份配置直接落 conf.d 即可。
# =============================================================================

server {
    listen 8090;
    server_name _;

    # ------------------------------------------------------------------
    # 这是一个**纯静态站点**，没有后端、没有 SPA。
    #
    # 与 quant 那份 nginx.conf 的关键差别，都来自这一点：
    #   - 没有任何反向代理（高德用明文密钥，不需要代理）；
    #   - **没有 try_files 兜底到 index.html**。Astro 产出的是一棵真实的
    #     目录树（/place/shatian-gang/index.html），每个 URL 都有对应文件。
    #     单页兜底在这里是有害的：不存在的路径会返回 200 + 首页 HTML，
    #     搜索引擎与 AI 爬虫会把它当成一个真实页面收录，制造大量软 404。
    #     站点的整个可信度建立在「页面说什么就是什么」上，这条不能破。
    # ------------------------------------------------------------------

    gzip on;
    gzip_types text/css application/javascript application/json application/xml
               application/rss+xml image/svg+xml text/plain;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # 目录式 URL：astro.config.mjs 里 trailingSlash='always' + format='directory'，
    # 产物是 /place/shatian-gang/index.html。**absolute_redirect off 是必须的**：
    # 默认的绝对跳转会用 nginx 自己的 listen 端口（8090）拼地址，于是从映射到
    # 别的宿主端口、或经 frp/网关访问时，/place/shatian-gang 的 301 会把人送到
    # 一个不存在的端口上去。quant 那边踩过同样的坑。
    absolute_redirect off;

    # ------------------------------------------------------------------
    # 机器可读接口。SEO/AEO/GEO 的入口全在这几个文件上，单独给缓存与类型：
    # 内容会随发布更新，但爬虫不该被长缓存挡在旧版本上。
    # ------------------------------------------------------------------
    location = /robots.txt {
        add_header Cache-Control "public, max-age=300";
        default_type text/plain;
    }

    location ~ ^/llms(-full)?\.txt$ {
        add_header Cache-Control "public, max-age=300";
        # charset 必须显式声明：这两个文件几乎全是中文，
        # 缺了它部分抓取端会按 latin-1 解码成乱码
        charset utf-8;
        default_type text/plain;
    }

    location = /entities.json {
        add_header Cache-Control "public, max-age=3600";
        # 供第三方直接取结构化数据，允许跨源读取
        add_header Access-Control-Allow-Origin "*";
        charset utf-8;
        default_type application/json;
    }

    location ~ ^/sitemap.*\.xml$ {
        add_header Cache-Control "public, max-age=3600";
        default_type application/xml;
    }

    location = /rss.xml {
        add_header Cache-Control "public, max-age=3600";
        charset utf-8;
        default_type application/rss+xml;
    }

    # 带内容指纹的构建产物，可以长缓存
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML 不缓存到浏览器：内容更正（尤其是把「待核实」改成已核实）
    # 应当立刻可见，而不是等一个缓存周期
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        charset utf-8;
        try_files $uri $uri/ =404;
    }


    # ------------------------------------------------------------------
    # /shatian 前缀。**两个入口都走这里**，不是只给网关用的：
    #
    #   http://114.55.135.237/shatian/       经网关（gateway.toml 原样转发，不剥前缀）
    #   http://192.168.64.201:8092/shatian/  局域网直连
    #
    # 站点按 base='/shatian/' 构建，HTML 里引的是 /shatian/_astro/x.css，所以
    # 上面两条到达这里时路径完全一样 —— **一种形状，不是两种**。quant 那边
    # 正是因为网关剥一次、容器再剥一次，导致局域网测的和生产跑的不是同一条路径。
    #
    # **base 不改变 dist 目录结构**：产物仍是 /place/xxx/index.html，没有 shatian
    # 这一层目录。所以前缀必须在这里剥掉。`last` 让重写后的 URI 回到上面的
    # location 表，于是 /shatian/entities.json 仍能命中那条专门的缓存规则。
    #
    # 下面那套不带前缀的规则保留着：局域网直接开 :8092/ 就能看，
    # 将来换独立域名（BASE_PATH=/ 重新构建）时这份配置不用动。
    # ------------------------------------------------------------------
    location = /shatian {
        # 相对跳转。默认的绝对跳转会用 nginx 自己的 listen 端口（8090）拼地址，
        # 于是从映射端口 8092 或经网关访问时，301 会把人送到一个不存在的端口去。
        absolute_redirect off;
        return 301 /shatian/;
    }

    location /shatian/ {
        rewrite ^/shatian/(.*)$ /$1 last;
    }

    # ------------------------------------------------------------------
    # 部署健康检查用。返回纯文本而不是首页：
    # 首页返回 200 只能说明 nginx 活着，说明不了产物完整。
    # 这里直接探一个真实的内容文件是否在位。
    # ------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        charset utf-8;
    }
}
