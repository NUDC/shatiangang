name: ${SHATIAN_PROJECT_NAME:-shatian-site}

# 沙田港文旅站的运行编排。镜像由 ops/deploy-release.sh 在服务器上从发布包构建，
# 这里只负责怎么跑：端口、资源上限、日志。
#
# **只有一个容器。** 这不是简化版，是这个站点的真实形状：纯静态产物 + nginx，
# 没有后端、没有数据库、没有需要保活的状态。quant 那套三容器编排里
# depends_on、健康就绪顺序、分别回滚标签的复杂度，这里一条都不需要。
#
# 镜像标签来自发布包的 tags.env：标签 = dist 目录的内容摘要。内容没变标签就不变，
# compose 看到同一个 image 引用就不重建容器 —— 重复发布同一份内容不会造成
# 一次无意义的重启。

services:
  shatian-web:
    image: ${SHATIAN_IMAGE_PREFIX:-wego}/shatian-web:${SHATIAN_WEB_VERSION:?来自发布包的 tags.env}
    container_name: shatian-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # 容器内固定监听 8090（见 ops/nginx.conf 的 listen），对外映射由左边决定。
    # **这台机器上宿主的 8090 已被 quant-api 占用**，所以 SHATIAN_WEB_PORT
    # 必须显式指定，不要依赖这里的默认值 —— 默认值只对空机器成立。
    ports:
      - "${SHATIAN_WEB_PORT:-8090}:8090"


    # **容器 DNS 必须显式指定。** 这台宿主用 systemd-resolved，Docker 会把
    # 127.0.0.53 当作上游塞进自定义网络的容器里 —— 而在容器内 127.0.0.53
    # 是它自己的回环，解析必然失败。症状是 nginx 转发高德时报 "bad address"，
    # 而宿主上 curl 高德完全正常，很容易查错方向。
    dns:
      - 223.5.5.5
      - 119.29.29.29


    # nginx 发静态文件，常驻内存很小。这台机器 1.6GB 且跑着 Postgres 与
    # 三个 quant 容器：给上限，宁可这个容器被 OOM 重启，也不能让 OOM killer
    # 挑中数据库。
    mem_limit: 64m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # 探真实内容文件而不是 /：nginx 活着不等于产物完整。
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8090/entities.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
